<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Rightmove Bulk Scraper</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>Rightmove Bulk Scraper</h1>
    </div>
    <div id="status">Open a Rightmove search results page, then come back here.</div>
  </header>

  <label class="ref-location panel">
    <div class="panel-row">
      <span class="panel-label">Distance from</span>
      <input type="text" id="refPostcode" placeholder="e.g. BA11 5HT" />
    </div>
    <span class="hint">Optional UK postcode — adds a straight-line distance (km) column</span>
  </label>

  <div class="score-box panel">
    <div class="score-title">Rank by importance</div>
    <div class="weight-panel">
      <div id="weightPie" class="weight-pie" aria-hidden="true"></div>
      <ul id="weightList" class="weight-list">
        <li data-metric="distanceKm">
          <span class="weight-swatch"></span>
          <span class="weight-label">Closer distance</span>
          <input type="range" class="weight-slider" data-metric="distanceKm" min="0" max="10" value="5" />
          <span class="weight-pct">0%</span>
        </li>
        <li data-metric="size">
          <span class="weight-swatch"></span>
          <span class="weight-label">More size</span>
          <input type="range" class="weight-slider" data-metric="size" min="0" max="10" value="4" />
          <span class="weight-pct">0%</span>
        </li>
        <li data-metric="price">
          <span class="weight-swatch"></span>
          <span class="weight-label">Lower price</span>
          <input type="range" class="weight-slider" data-metric="price" min="0" max="10" value="3" />
          <span class="weight-pct">0%</span>
        </li>
        <li data-metric="bedrooms">
          <span class="weight-swatch"></span>
          <span class="weight-label">More bedrooms</span>
          <input type="range" class="weight-slider" data-metric="bedrooms" min="0" max="10" value="2" />
          <span class="weight-pct">0%</span>
        </li>
        <li data-metric="bathrooms">
          <span class="weight-swatch"></span>
          <span class="weight-label">More bathrooms</span>
          <input type="range" class="weight-slider" data-metric="bathrooms" min="0" max="10" value="1" />
          <span class="weight-pct">0%</span>
        </li>
      </ul>
    </div>
    <div class="hint">Greyed out until a postcode is entered above</div>
    <div id="topMatches" class="top-matches hidden"></div>
  </div>

  <label class="deep-toggle panel">
    <input type="checkbox" id="deepToggle" class="switch-input" />
    <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
    <span class="switch-text">
      Fetch full details
      <span class="hint">Tenure, council tax band, EPC, service charge — much slower, briefly opens each listing in a hidden window</span>
    </span>
  </label>

  <div class="detail-fields">
    <div class="detail-fields-title">Which details to fetch</div>
    <div class="detail-fields-grid">
      <label><input type="checkbox" class="detail-field" data-field="tenure" checked /> Tenure</label>
      <label><input type="checkbox" class="detail-field" data-field="councilTaxBand" checked /> Council Tax Band</label>
      <label><input type="checkbox" class="detail-field" data-field="epcRating" checked /> EPC Rating</label>
      <label><input type="checkbox" class="detail-field" data-field="groundRent" checked /> Ground Rent</label>
      <label><input type="checkbox" class="detail-field" data-field="serviceCharge" checked /> Service Charge</label>
    </div>
    <label class="floorplan-field">
      <input type="checkbox" class="detail-field" data-field="floorplanSize" />
      Estimate size from floorplan when missing or an outlier
      <span class="hint">Experimental — reads the floorplan image with OCR, adds a few seconds per listing, and isn't always accurate. Also double-checks listings whose listed size looks like a data-entry error. Estimates go in their own "Size (OCR est.)" column, never overwriting Rightmove's own figure</span>
    </label>
  </div>

  <label class="concurrency-row panel">
    <div class="panel-row">
      <span class="panel-label">Parallel windows</span>
      <input type="number" id="concurrencyInput" min="1" max="10" value="4" />
    </div>
    <span class="hint">Lower this if Chrome becomes sluggish or unresponsive</span>
  </label>

  <div class="buttons">
    <button id="startBtn" class="btn btn-primary">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      Scrape all pages
    </button>
    <button id="stopBtn" class="btn btn-outline" disabled>
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
      Stop
    </button>
    <button id="downloadBtn" class="btn btn-secondary" disabled>
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      Download Excel
    </button>
    <button id="openTopBtn" class="btn btn-tertiary" disabled>
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      Open Top 10
    </button>
  </div>

  <div id="progressWrap" class="hidden">
    <div id="progressBar"><div id="progressFill"></div></div>
    <div id="progressText"></div>
  </div>

  <div id="note" class="hidden"></div>
  <div id="log"></div>

  <script src="xlsx.js"></script>
  <script src="popup.js"></script>
</body>
</html>
